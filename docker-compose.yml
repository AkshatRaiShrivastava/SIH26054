services:
  postgres:
    image: postgres:16-alpine
    container_name: uav-telemetry-postgres
    environment:
      POSTGRES_DB: uav_telemetry
      POSTGRES_USER: uav
      POSTGRES_PASSWORD: uav
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uav -d uav_telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
