services:
  postgres:
    image: postgres:16
    container_name: uav-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-uav_engine}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uav} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    image: postgres:16
    container_name: uav-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uav}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-uav_engine}
    volumes:
      - ./db/init.sql:/init.sql:ro
    command: >-
      sh -c 'set -e; export PGPASSWORD="$$POSTGRES_PASSWORD";
      until pg_isready -h postgres -U "$$POSTGRES_USER" -d postgres; do sleep 2; done;
      if ! psql -h postgres -U "$$POSTGRES_USER" -d postgres -lqt | grep -qw "$$POSTGRES_DB";
      then psql -h postgres -U "$$POSTGRES_USER" -d postgres -c "CREATE DATABASE \"$$POSTGRES_DB\""; fi;
      psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f /init.sql'

  can-init:
    image: alpine:3.20
    container_name: uav-can-init
    network_mode: host
    privileged: true
    command: >-
      sh -c 'set -e;
      apk add --no-cache iproute2 kmod >/dev/null;
      modprobe vcan 2>/dev/null || true;
      ip link show "$$CAN_INTERFACE" >/dev/null 2>&1 || ip link add dev "$$CAN_INTERFACE" type vcan;
      ip link set "$$CAN_INTERFACE" up'
    environment:
      CAN_INTERFACE: ${CAN_INTERFACE:-vcan0}

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uav-backend
    depends_on:
      db-init:
        condition: service_completed_successfully
      can-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://uav:password@localhost:5432/uav_engine}
      CAN_INTERFACE: ${CAN_INTERFACE:-vcan0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
    ports:
      - "8000:8000"
    network_mode: host
    command: python -m backend.main
    volumes:
      - .:/workspace
      - /var/run:/var/run

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uav-simulator
    depends_on:
      db-init:
        condition: service_completed_successfully
      can-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://uav:password@localhost:5432/uav_engine}
      CAN_INTERFACE: ${CAN_INTERFACE:-vcan0}
    network_mode: host
    command: python -m simulator.main --scenario normal --speed-multiplier 10 --tick-hz 1
    volumes:
      - .:/workspace
      - /var/run:/var/run

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: uav-dashboard
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
